<VirtualHost *:80>
    ServerName att.minamail.se
    ServerAlias www.att.minamail.se

    # ACME challenge för Let's Encrypt (certbot)
    ProxyPass /.well-known/ !
    DocumentRoot /var/www/html

    # HTTP to HTTPS redirect
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName att.minamail.se
    ServerAlias www.att.minamail.se

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/webmin/letsencrypt-cert.pem
    SSLCertificateKeyFile /etc/webmin/letsencrypt-key.pem
    SSLCertificateChainFile /etc/webmin/letsencrypt-ca.pem

    # SSL Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    # Proxy Settings
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 600

    # Don't proxy ACME challenges
    ProxyPass /.well-known/ !

    # ============================================
    # NEXTAUTH ROUTES (handled by frontend - DON'T PROXY)
    # ============================================
    # NextAuth endpoints stay on frontend (port 4011)
    # /api/auth/* → DO NOT proxy to backend

    # ============================================
    # BACKEND API ROUTES (port 4010)
    # ============================================
    # Proxy backend API routes (EXCEPT /api/auth/*)
    ProxyPass /api/attendance http://localhost:4010/api/attendance
    ProxyPass /api/classes http://localhost:4010/api/classes
    ProxyPass /api/config http://localhost:4010/api/config
    ProxyPass /api/kiosk-attendance http://localhost:4010/api/kiosk-attendance
    ProxyPass /api/kiosks http://localhost:4010/api/kiosks
    ProxyPass /api/schedules http://localhost:4010/api/schedules
    ProxyPass /api/students http://localhost:4010/api/students
    ProxyPass /api/users http://localhost:4010/api/users
    
    ProxyPassReverse /api/attendance http://localhost:4010/api/attendance
    ProxyPassReverse /api/classes http://localhost:4010/api/classes
    ProxyPassReverse /api/config http://localhost:4010/api/config
    ProxyPassReverse /api/kiosk-attendance http://localhost:4010/api/kiosk-attendance
    ProxyPassReverse /api/kiosks http://localhost:4010/api/kiosks
    ProxyPassReverse /api/schedules http://localhost:4010/api/schedules
    ProxyPassReverse /api/students http://localhost:4010/api/students
    ProxyPassReverse /api/users http://localhost:4010/api/users

    # ============================================
    # FRONTEND ROUTES (port 4011)
    # ============================================
    ProxyPass /_next/ http://localhost:4011/_next/
    ProxyPass /static/ http://localhost:4011/static/
    ProxyPass /favicon.ico http://localhost:4011/favicon.ico
    ProxyPass /sitemap.xml http://localhost:4011/sitemap.xml
    ProxyPass / http://localhost:4011/

    # PassReverse för backend
    ProxyPassReverse /api/ http://localhost:4010/api/
    ProxyPassReverse /auth/ http://localhost:4010/auth/

    # PassReverse för frontend
    ProxyPassReverse /_next/ http://localhost:4011/_next/
    ProxyPassReverse /static/ http://localhost:4011/static/
    ProxyPassReverse / http://localhost:4011/

    # ============================================
    # HEADERS FÖR PROXYING
    # ============================================
    RequestHeader set X-Forwarded-Proto https
    RequestHeader set X-Forwarded-Port 443

    # ============================================
    # LOGGING
    # ============================================
    CustomLog ${APACHE_LOG_DIR}/att.minamail.se-access.log combined
    ErrorLog ${APACHE_LOG_DIR}/att.minamail.se-error.log
    LogLevel warn
</VirtualHost>
