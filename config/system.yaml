# System configuration for karate school attendance management
# Edit this file to manage categories and belt levels
# Changes require application restart to take effect

version: "1.0"

# Student and class categories
# These define the different skill/age levels for classes and students
categories:
  - value: "barn"
    label: "Barn"
    description: "Barnträning (8-11 år)"
    order: 1

  - value: "ungdom"
    label: "Ungdom"
    description: "Ungdomsträning (12-17 år)"
    order: 2

  - value: "vuxen"
    label: "Vuxen"
    description: "Vuxenträning (18+ år)"
    order: 3

  - value: "avancerad"
    label: "Avancerad"
    description: "Avancerad träning för alla åldrar"
    order: 4

  - value: "instruktor"
    label: "Instruktör"
    description: "Instruktörer (motsvarar kategorin Instructor i medlemsregistret)"
    order: 5

